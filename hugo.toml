baseURL = 'https://tamaradraguta.github.io/blog/'
languageCode = 'en-us'
title = 'My Developer Journey'
author = "Tamara Draguta"
paginate = 10

[outputs]
  home = ["HTML", "JSON"]

[module]
  [[module.imports]]
    path = "github.com/jpanther/congo/v2"

[params]
  description = "my developer journey with Spring AI and Kotlin"

  # Congo theme settings
  colorScheme = "auto"
  darkMode = true

  [params.author]
    name = "Tamara Draguta"

  # Social links
  [[params.socialIcons]]
    icon = "github"
    title = "GitHub"
    url = "https://github.com/tamaradraguta"

[markup.goldmark.renderer]
  unsafe = true
